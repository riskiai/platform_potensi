name: potensi-prod

services:
  db:
    image: mysql:8.0
    container_name: potensi_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: db_potensi
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-SecretRootPass123!}
    volumes:
      - potensi_mysql_data_prod:/var/lib/mysql
    networks:
      - potensi_network_prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: potensi_backend_prod
    build:
      context: ../potensi_backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../potensi_backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
    ports:
      # Port 8000 opsional jika ingin akses backend langsung
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - potensi_network_prod
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: potensi_frontend_prod
    build:
      context: ../potensi_frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../potensi_frontend/.env
    ports:
      # Port utama aplikasi produksi (Web + Reverse Proxy API)
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - potensi_network_prod
    depends_on:
      - backend

volumes:
  potensi_mysql_data_prod:

networks:
  potensi_network_prod:
    driver: bridge

