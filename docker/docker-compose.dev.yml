name: potensi-dev

services:
  db:
    image: mysql:8.0
    container_name: potensi_db_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_potensi
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      # Port 3307 pada host agar tidak bentrok jika port 3306 sudah dipakai MySQL lokal
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - potensi_mysql_data_dev:/var/lib/mysql
    networks:
      - potensi_network_dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: potensi_backend_dev
    build:
      context: ../potensi_backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../potensi_backend/.env
    environment:
      # Menghubungkan Laravel ke host database container Docker
      DB_HOST: db
    volumes:
      - ../potensi_backend:/var/www/html
    networks:
      - potensi_network_dev
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: potensi_frontend_dev
    build:
      context: ../potensi_frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ../potensi_frontend/.env
    volumes:
      - ../potensi_frontend:/app
      - /app/node_modules
    networks:
      - potensi_network_dev
    depends_on:
      - backend

volumes:
  potensi_mysql_data_dev:

networks:
  potensi_network_dev:
    driver: bridge

